<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trabajos Pendientes</title>
  
  <!-- Anti-Cache para evitar versiones viejas del navegador -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Favicon: Rayo blanco con fondo celeste vibrante -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22bg%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%230284C7%22/%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%2338BDF8%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23bg%29%22/%3E%3Cpath%20d%3D%22M35%2010%20L20%2033%20L31%2033%20L28%2054%20L44%2029%20L33%2029%20Z%22%20fill%3D%22%23FFFFFF%22/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22bg%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%230284C7%22/%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%2338BDF8%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23bg%29%22/%3E%3Cpath%20d%3D%22M35%2010%20L20%2033%20L31%2033%20L28%2054%20L44%2029%20L33%2029%20Z%22%20fill%3D%22%23FFFFFF%22/%3E%3C/svg%3E">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              950: '#070A12',
              900: '#0B0F19',
              850: '#101726',
              800: '#162033',
              700: '#23314D',
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #070A12;
      color: #E2E8F0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Fondo fluido animado nativo en CSS (sin dependencias ni scripts bloqueables) */
    .fluid-bg-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .orb {
      position: absolute;
      border-radius: 9999px;
      will-change: transform;
      pointer-events: none;
    }
    .orb-purple {
      width: 580px;
      height: 580px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.45) 0%, rgba(109, 40, 217, 0.25) 50%, transparent 75%);
      filter: blur(100px);
      top: -100px;
      left: -50px;
      animation: floatA 22s ease-in-out infinite alternate;
    }
    .orb-cyan {
      width: 620px;
      height: 620px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.45) 0%, rgba(2, 132, 199, 0.25) 50%, transparent 75%);
      filter: blur(110px);
      bottom: -120px;
      right: -80px;
      animation: floatB 26s ease-in-out infinite alternate;
    }
    .orb-indigo {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.35) 0%, rgba(124, 58, 237, 0.2) 50%, transparent 75%);
      filter: blur(95px);
      top: 40%;
      left: 35%;
      animation: floatC 18s ease-in-out infinite alternate;
    }

    @keyframes floatA {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(120px, 80px) scale(1.1); }
      100% { transform: translate(-60px, 140px) scale(0.95); }
    }
    @keyframes floatB {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-140px, -90px) scale(1.08); }
      100% { transform: translate(70px, -130px) scale(0.92); }
    }
    @keyframes floatC {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-80px, 60px) scale(1.12); }
      100% { transform: translate(90px, -50px) scale(0.9); }
    }

    /* Paneles con estética Glassmorphism */
    .glass-panel {
      background: rgba(16, 23, 38, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .glass-card {
      background: rgba(22, 32, 51, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      background: rgba(28, 41, 65, 0.85);
      transform: translateY(-2px);
      border-color: rgba(6, 182, 212, 0.3);
    }
    .glass-card.active-kpi {
      background: rgba(28, 41, 65, 0.95);
      border-color: rgba(6, 182, 212, 0.7);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
    }

    .table-row-card {
      transition: background 0.15s, transform 0.15s;
      cursor: pointer;
    }
    .table-row-card:hover {
      background: rgba(255, 255, 255, 0.04);
      transform: scale(1.01);
    }

    .circle-progress {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* Scrollbars estéticos */
    .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="selection:bg-cyan-500 selection:text-black">

  <!-- FONDO DE ESFERAS FLUIDAS VIBRANTES -->
  <div class="fluid-bg-container">
    <div id="orb1" class="orb orb-purple"></div>
    <div id="orb2" class="orb orb-cyan"></div>
    <div id="orb3" class="orb orb-indigo"></div>
  </div>

  <!-- NOTIFICACIÓN TOAST -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-dark-850/95 border border-cyan-500/40 text-white text-xs px-4 py-2 rounded-2xl shadow-2xl backdrop-blur-md flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none -translate-y-2">
    <span id="toastText">Sincronizado</span>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-30 glass-panel border-b border-white/[0.06] w-full">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
      
      <!-- Lado Izquierdo: Logo, Título, Estado y Presencia (Ojo) -->
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-cyan-400 text-white flex items-center justify-center shadow-lg shadow-cyan-500/25 shrink-0">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-base font-bold text-white tracking-tight truncate">Trabajos</span>
            
            <!-- Indicador en Línea -->
            <span id="syncBadge" class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-dark-850 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5 shrink-0">
              <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
              <span id="syncText" class="hidden sm:inline">En línea</span>
            </span>

            <!-- INDICADOR DE DISPOSITIVOS ACTIVOS (OJO) -->
            <span id="presenceBadge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-white/[0.04] border border-white/[0.08] text-slate-300 shrink-0 select-none" title="Dispositivos conectados en vivo">
              <svg class="w-3.5 h-3.5 text-cyan-400 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <span id="presenceCount" class="text-[11px] font-extrabold text-cyan-300">1</span>
            </span>
          </div>
          <p class="text-[11px] text-slate-400 truncate hidden sm:block">Control en tiempo real</p>
        </div>
      </div>

      <!-- Lado Derecho: Acciones -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- Desktop Buttons -->
        <div class="hidden md:flex items-center gap-1.5">
          <button onclick="manualSync()" title="Forzar sincronización con la nube" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white bg-white/[0.04] hover:bg-white/[0.08] rounded-xl border border-white/[0.06] transition-all">
            <svg class="w-3.5 h-3.5 text-cyan-400 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Sincronizar
          </button>
          <button onclick="openVariantsModal()" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white bg-white/[0.04] hover:bg-white/[0.08] rounded-xl border border-white/[0.06] transition-all">
            <svg class="w-3.5 h-3.5 text-slate-400 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            Empresas
          </button>
          <button onclick="exportData()" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white bg-white/[0.04] hover:bg-white/[0.08] rounded-xl border border-white/[0.06] transition-all">
            <svg class="w-3.5 h-3.5 text-slate-400 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Exportar
          </button>
          <button onclick="document.getElementById('importFileInput').click()" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white bg-white/[0.04] hover:bg-white/[0.08] rounded-xl border border-white/[0.06] transition-all">
            <svg class="w-3.5 h-3.5 text-slate-400 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            Importar
          </button>
        </div>

        <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">

        <!-- Botón + Nueva Tarea -->
        <button onclick="openTaskModal()" class="inline-flex items-center gap-1 px-3.5 py-1.5 text-xs font-bold text-white bg-gradient-to-r from-sky-500 to-cyan-500 hover:from-sky-400 hover:to-cyan-400 rounded-xl shadow-lg shadow-cyan-500/25 transition-all shrink-0">
          <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          <span class="hidden sm:inline">Nueva</span> Tarea
        </button>

        <!-- Móvil: Sincronizar rápido y Menú 3 líneas -->
        <button onclick="manualSync()" class="md:hidden w-9 h-9 rounded-xl bg-white/[0.04] text-cyan-400 flex items-center justify-center border border-white/[0.06]">
          <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
        <button onclick="openBottomSheet()" class="md:hidden w-9 h-9 rounded-xl bg-white/[0.04] text-slate-300 flex items-center justify-center border border-white/[0.06]">
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>

    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 mt-5 relative z-10 w-full">

    <!-- KPI CARDS (Filtros de estado en una fila deslizable en móvil y grid en desktop) -->
    <div class="mb-4">
      <div id="kpiContainer" class="flex md:grid md:grid-cols-6 gap-2 sm:gap-2.5 overflow-x-auto custom-scroll pb-1.5 no-scrollbar snap-x snap-mandatory"></div>
    </div>

    <!-- Indicador de Filtro Activo -->
    <div id="activeFilterBadge" class="hidden mb-3.5 flex items-center gap-2">
      <span class="text-xs text-slate-400">Filtrando por:</span>
      <span id="activeFilterText" class="inline-flex items-center gap-1 text-xs font-bold px-2.5 py-0.5 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
        <button onclick="setStatusFilter('')" class="ml-1 hover:text-white">✕</button>
      </span>
      <button onclick="setStatusFilter('')" class="text-xs text-slate-500 hover:text-slate-300 underline">Limpiar</button>
    </div>

    <!-- Barra de Búsqueda y Filtros -->
    <div class="glass-panel p-3 rounded-2xl mb-4 shadow-xl flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5">
      <div class="flex items-center gap-2 flex-1 bg-white/[0.025] rounded-xl px-3 py-2 border border-white/[0.04]">
        <svg class="w-4 h-4 text-slate-400 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar por cliente, descripción o detalles..." oninput="renderTable()"
          class="w-full text-xs sm:text-sm bg-transparent outline-none placeholder:text-slate-500 text-white">
      </div>
      <div class="flex items-center gap-2">
        <select id="filterCompany" onchange="renderTable()" class="flex-1 sm:flex-initial text-xs font-medium bg-dark-850 border border-white/[0.06] rounded-xl px-3 py-2 text-slate-300 outline-none">
          <option value="">Todas las empresas</option>
        </select>
        <select id="filterPriority" onchange="renderTable()" class="flex-1 sm:flex-initial text-xs font-medium bg-dark-850 border border-white/[0.06] rounded-xl px-3 py-2 text-slate-300 outline-none">
          <option value="">Todas las prioridades</option>
        </select>
      </div>
    </div>

    <!-- TABLA CON SCROLL HORIZONTAL ENCAPSULADO -->
    <div class="glass-panel rounded-2xl overflow-hidden shadow-2xl w-full">
      <div class="overflow-x-auto custom-scroll w-full">
        <table class="w-full text-left border-collapse min-w-[780px]">
          <thead>
            <tr class="border-b border-white/[0.05] bg-white/[0.015] text-slate-400 text-[11px] uppercase tracking-wider font-semibold select-none">
              <th class="py-3.5 px-4 w-16 text-center">Progreso</th>
              <th class="py-3.5 px-4">Empresa</th>
              <th class="py-3.5 px-4">Descripción del Trabajo</th>
              <th class="py-3.5 px-4">Estado</th>
              <th class="py-3.5 px-4">Prioridad</th>
              <th class="py-3.5 px-4">Fecha Ingreso</th>
              <th class="py-3.5 px-4">Detalles</th>
              <th class="py-3.5 px-4 text-center w-24">Acciones</th>
            </tr>
          </thead>
          <tbody id="tasksTableBody" class="divide-y divide-white/[0.03] text-sm"></tbody>
        </table>
      </div>
      <div id="emptyState" class="hidden p-14 text-center">
        <p class="text-slate-400 text-sm">No se encontraron trabajos registrados.</p>
      </div>
    </div>

  </main>

  <!-- MODAL: CREAR / EDITAR TAREA -->
  <div id="taskModal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center hidden p-3 sm:p-4">
    <div class="bg-dark-900 border border-white/[0.08] rounded-2xl max-w-lg w-full p-5 sm:p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto custom-scroll">
      <div class="flex items-center justify-between pb-3 border-b border-white/[0.06] mb-4">
        <h3 id="modalTitleText" class="text-base font-bold text-white">Nueva Tarea</h3>
        <button onclick="closeTaskModal()" class="text-slate-400 hover:text-white p-1">✕</button>
      </div>
      <form id="taskForm" onsubmit="saveTask(event)" class="space-y-3.5">
        <input type="hidden" id="taskId">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Empresa / Cliente</label>
          <select id="taskCompany" required class="w-full text-sm border border-white/[0.08] rounded-xl px-3 py-2 bg-dark-850 text-white outline-none focus:border-cyan-400"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Descripción del Trabajo</label>
          <textarea id="taskDesc" required rows="2" placeholder="Ej: Diseñar flyers..." class="w-full text-sm border border-white/[0.08] rounded-xl px-3 py-2 bg-dark-850 text-white outline-none focus:border-cyan-400"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Estado</label>
            <select id="taskStatus" required class="w-full text-sm border border-white/[0.08] rounded-xl px-3 py-2 bg-dark-850 text-white outline-none focus:border-cyan-400"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Prioridad</label>
            <select id="taskPriority" required class="w-full text-sm border border-white/[0.08] rounded-xl px-3 py-2 bg-dark-850 text-white outline-none focus:border-cyan-400"></select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Fecha de Ingreso</label>
          <input type="date" id="taskDate" class="w-full text-sm border border-white/[0.08] rounded-xl px-3 py-2 bg-dark-850 text-white outline-none focus:border-cyan-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Detalles / Observaciones</label>
          <input type="text" id="taskDetails" placeholder="Notas adicionales..." class="w-full text-sm border border-white/[0.08] rounded-xl px-3 py-2 bg-dark-850 text-white outline-none focus:border-cyan-400">
        </div>
        <div class="pt-3 flex justify-end gap-2 border-t border-white/[0.06]">
          <button type="button" onclick="closeTaskModal()" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white rounded-xl">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-xs font-bold text-white bg-gradient-to-r from-sky-500 to-cyan-500 hover:from-sky-400 hover:to-cyan-400 rounded-xl shadow-lg shadow-cyan-500/25">Guardar Tarea</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: GESTIONAR EMPRESAS -->
  <div id="variantsModal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center hidden p-3 sm:p-4">
    <div class="bg-dark-900 border border-white/[0.08] rounded-2xl max-w-md w-full p-5 sm:p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-white/[0.06] mb-4">
        <h3 class="text-base font-bold text-white">Empresas / Clientes</h3>
        <button onclick="closeVariantsModal()" class="text-slate-400 hover:text-white p-1">✕</button>
      </div>
      <div class="mb-4">
        <div class="flex gap-2 mb-3">
          <input type="text" id="newCompanyName" placeholder="Nueva empresa..." class="flex-1 text-xs border border-white/[0.08] rounded-xl px-3 py-2 bg-dark-850 text-white outline-none focus:border-cyan-400">
          <button onclick="addCompany()" class="px-3 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-500 rounded-xl">+ Añadir</button>
        </div>
        <div id="companiesList" class="flex flex-wrap gap-2 max-h-52 overflow-y-auto custom-scroll p-1"></div>
      </div>
      <div class="pt-3 flex justify-end border-t border-white/[0.06]">
        <button onclick="closeVariantsModal()" class="px-4 py-2 text-xs font-semibold text-slate-300 hover:text-white rounded-xl">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM SHEET MÓVIL (3 LÍNEAS) -->
  <div id="bottomSheetModal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-end justify-center hidden" onclick="closeBottomSheet()">
    <div class="bg-dark-900 border-t border-white/[0.1] rounded-t-3xl w-full max-w-lg p-5 shadow-2xl" onclick="event.stopPropagation()">
      <div class="w-12 h-1 rounded-full bg-white/20 mx-auto mb-4"></div>
      <div class="flex items-center justify-between pb-3 border-b border-white/[0.06] mb-3">
        <h3 class="text-sm font-bold text-white">Menú de Opciones</h3>
        <button onclick="closeBottomSheet()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div class="grid grid-cols-3 gap-2 mb-2">
        <button onclick="closeBottomSheet(); openVariantsModal();" class="p-3 rounded-2xl bg-white/[0.03] border border-white/[0.04] text-center">
          <div class="text-xs font-bold text-white mb-0.5">Empresas</div>
          <div class="text-[10px] text-slate-400">Gestionar</div>
        </button>
        <button onclick="closeBottomSheet(); exportData();" class="p-3 rounded-2xl bg-white/[0.03] border border-white/[0.04] text-center">
          <div class="text-xs font-bold text-white mb-0.5">Exportar</div>
          <div class="text-[10px] text-slate-400">Copia JSON</div>
        </button>
        <button onclick="closeBottomSheet(); document.getElementById('importFileInput').click();" class="p-3 rounded-2xl bg-white/[0.03] border border-white/[0.04] text-center">
          <div class="text-xs font-bold text-white mb-0.5">Importar</div>
          <div class="text-[10px] text-slate-400">Cargar JSON</div>
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ☁️ ARQUITECTURA REST DIRECTA A FIRESTORE
    // =========================================================================
    const FIREBASE_PROJECT_ID = "trabajos-pendientes-59380";
    const FIRESTORE_ENDPOINT = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/boards/main`;

    const DEFAULT_CONFIG = {
      companies: ["UNICO", "Itraco", "Royal Enfield", "Alta Vista", "Hotel Bicentenario", "RevCardinal", "Bmw"],
      statuses: [
        { name: "No realizado", percent: 0 },
        { name: "En proceso", percent: 25 },
        { name: "Chequeo / Entregado", percent: 50 },
        { name: "Aprobado", percent: 75 },
        { name: "Realizado / Finalizado", percent: 100 }
      ],
      priorities: [
        { name: "Máxima", color: "rose", weight: 3 },
        { name: "Media", color: "amber", weight: 2 },
        { name: "Mínima", color: "slate", weight: 1 }
      ]
    };

    // Tus 8 tareas reales pre-cargadas directamente desde tu archivo JSON:
    const INITIAL_SAVED_DATA = {
      "companies": ["UNICO", "Itraco", "Royal Enfield", "Alta Vista", "Hotel Bicentenario", "RevCardinal", "Bmw"],
      "tasks": [
        { "id": "task-1", "company": "UNICO", "desc": "Crear página de Facebook e Instagram y armar placas para feed + historias", "status": "Aprobado", "priority": "Máxima", "date": "", "details": "Terminar de Postear por Facebook", "progress": 75, "updatedAt": 1788526382133 },
        { "id": "task-1788369200849", "company": "Royal Enfield", "desc": "Crear placa para contratacion de administrativo", "status": "Realizado / Finalizado", "priority": "Máxima", "date": "2026-09-02", "details": "-", "progress": 100, "updatedAt": 1788525676222 },
        { "id": "task-2", "company": "Itraco", "desc": "Realizar 3 posts sobre el edificio de Las Piedras", "status": "Realizado / Finalizado", "priority": "Máxima", "date": "", "details": "Falta corroborar copies", "progress": 100, "updatedAt": 1788526335985 },
        { "id": "task-3", "company": "Royal Enfield", "desc": "Modificar placas madre con logo de la concesionaria", "status": "Realizado / Finalizado", "priority": "Máxima", "date": "", "details": "En espera de respuesta", "progress": 100, "updatedAt": 1788526328059 },
        { "id": "task-4", "company": "Hotel Bicentenario", "desc": "Armar placa individual para el club San Martín", "status": "Chequeo / Entregado", "priority": "Media", "date": "2026-09-01", "details": "-", "progress": 50, "updatedAt": 1788526319217 },
        { "id": "task-5", "company": "Royal Enfield", "desc": "Realizar edición de video de quedada", "status": "En proceso", "priority": "Media", "date": "", "details": "-", "progress": 25, "updatedAt": 1788525676222 },
        { "id": "task-6", "company": "Alta Vista", "desc": "Con las fotos de Cande de la obra de Alta Vista hacer placas de venta en pozo torre 2 (1, 2 y 3 dorm)", "status": "Realizado / Finalizado", "priority": "Media", "date": "", "details": "-", "progress": 100, "updatedAt": 1788526314869 },
        { "id": "task-7", "company": "RevCardinal", "desc": "Armar tarjeta de presentación con QR a la página oficial", "status": "No realizado", "priority": "Mínima", "date": "", "details": "-", "progress": 0, "updatedAt": 1788525676222 }
      ]
    };

    let config = { ...DEFAULT_CONFIG, companies: INITIAL_SAVED_DATA.companies };
    let tasks = INITIAL_SAVED_DATA.tasks;
    let activeStatusFilter = "";

    function sanitizeTask(t) {
      return {
        id: String(t.id || ("task-" + Date.now())),
        company: String(t.company || "").trim(),
        desc: String(t.desc || "").trim(),
        status: String(t.status || "No realizado").trim(),
        priority: String(t.priority || "Media").trim(),
        date: String(t.date || "").trim(),
        details: String(t.details || "-").trim(),
        progress: Number(t.progress) || 0,
        updatedAt: t.updatedAt || Date.now()
      };
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      const text = document.getElementById('toastText');
      if (!t || !text) return;
      text.innerText = msg;
      t.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      setTimeout(() => {
        t.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }, 2500);
    }

    function updateSyncBadge(status, color) {
      const dot = document.getElementById('syncDot');
      const text = document.getElementById('syncText');
      if (!dot) return;
      if (color === 'green') {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]';
        if (text) text.innerText = status;
      } else if (color === 'yellow') {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping';
        if (text) text.innerText = status;
      } else {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-400';
        if (text) text.innerText = status;
      }
    }

    // CARGA DESDE LA NUBE
    async function loadFromCloud(silent = false) {
      if (!silent) updateSyncBadge("Sincronizando...", "yellow");
      try {
        const res = await fetch(FIRESTORE_ENDPOINT, { cache: 'no-store' });
        if (res.status === 404) {
          // Si el documento en la nube no existe aún, subimos tus datos reales
          await saveToCloud();
          updateSyncBadge("En línea", "green");
          return;
        }

        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();
        if (data.fields && data.fields.payload && data.fields.payload.stringValue) {
          const parsed = JSON.parse(data.fields.payload.stringValue);
          const newTasks = (parsed.tasks || []).map(sanitizeTask);
          const newComp = (parsed.companies && Array.isArray(parsed.companies)) ? parsed.companies : config.companies;

          // Si son iguales, no tocar el DOM para evitar parpadeos
          if (JSON.stringify(tasks) === JSON.stringify(newTasks) && JSON.stringify(config.companies) === JSON.stringify(newComp)) {
            updateSyncBadge("En línea", "green");
            return;
          }

          tasks = newTasks;
          config.companies = newComp;
          localStorage.setItem('tp_saved_data', JSON.stringify({ tasks, companies: config.companies }));
          populateDropdowns();
          renderTable();
          renderKPIs();
          updateSyncBadge("En línea", "green");
        }
      } catch (err) {
        console.warn("Error cargando de la nube, usando datos en memoria:", err);
        updateSyncBadge("En línea", "green");
      }
    }

    // GUARDADO EN LA NUBE
    async function saveToCloud() {
      updateSyncBadge("Guardando...", "yellow");
      localStorage.setItem('tp_saved_data', JSON.stringify({ tasks, companies: config.companies }));
      renderKPIs();
      renderTable();

      try {
        const payloadString = JSON.stringify({
          tasks: tasks,
          companies: config.companies,
          updatedAt: Date.now()
        });

        const url = `${FIRESTORE_ENDPOINT}?updateMask.fieldPaths=payload`;
        const res = await fetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: {
              payload: { stringValue: payloadString }
            }
          })
        });

        if (res.ok) {
          updateSyncBadge("En línea", "green");
        } else {
          updateSyncBadge("Error al guardar", "red");
        }
      } catch (err) {
        console.warn("Fallo de red:", err);
        updateSyncBadge("Sin conexión", "red");
      }
    }

    async function manualSync() {
      showToast("Sincronizando con la nube...");
      await loadFromCloud(false);
      showToast("¡Datos sincronizados!");
    }

    // COLORIMETRÍA EXACTA: 0% Gris, 25% Amarillo, 50% Lima/Verde amarillento, 75% Verde, 100% Cyan
    function getProgressStyle(percent) {
      if (percent <= 0) return { stroke: "#64748B", text: "text-slate-400" };
      if (percent <= 35) return { stroke: "#FACC15", text: "text-yellow-400" }; // Amarillo
      if (percent <= 60) return { stroke: "#A3E635", text: "text-lime-400" }; // Lima / Verde amarillento
      if (percent <= 85) return { stroke: "#22C55E", text: "text-emerald-400" }; // Verde
      return { stroke: "#06B6D4", text: "text-cyan-400" }; // Cyan
    }

    function renderCircularProgress(percent) {
      const radius = 15;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (percent / 100) * circumference;
      const style = getProgressStyle(percent);

      return `
        <div class="relative w-10 h-10 flex items-center justify-center shrink-0">
          <svg class="w-10 h-10 circle-progress" viewBox="0 0 38 38">
            <circle cx="19" cy="19" r="${radius}" fill="transparent" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" />
            <circle cx="19" cy="19" r="${radius}" fill="transparent" stroke="${style.stroke}" stroke-width="3"
              stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" />
          </svg>
          <span class="absolute text-[10px] font-extrabold ${style.text} tracking-tighter">${percent}%</span>
        </div>
      `;
    }

    function setStatusFilter(statusKey) {
      activeStatusFilter = (activeStatusFilter === statusKey) ? "" : statusKey;
      const badge = document.getElementById('activeFilterBadge');
      const text = document.getElementById('activeFilterText');
      if (activeStatusFilter) {
        badge.classList.remove('hidden');
        text.innerHTML = `${activeStatusFilter} <button onclick="setStatusFilter('')" class="ml-1 hover:text-white">✕</button>`;
      } else {
        badge.classList.add('hidden');
      }
      renderKPIs();
      renderTable();
    }

    // TARJETAS KPI
    function renderKPIs() {
      const total = tasks.length;
      const pendientes = tasks.filter(t => t.status === "No realizado").length;
      const enProceso = tasks.filter(t => t.status === "En proceso").length;
      const entregados = tasks.filter(t => t.status === "Chequeo / Entregado").length;
      const aprobados = tasks.filter(t => t.status === "Aprobado").length;
      const completados = tasks.filter(t => t.status === "Realizado / Finalizado").length;

      const items = [
        { label: "Total", filterKey: "", value: total, text: "text-white" },
        { label: "Pendientes", filterKey: "No realizado", value: pendientes, text: "text-slate-300" },
        { label: "En Proceso", filterKey: "En proceso", value: enProceso, text: "text-yellow-400" },
        { label: "Entregados", filterKey: "Chequeo / Entregado", value: entregados, text: "text-lime-400" },
        { label: "Aprobados", filterKey: "Aprobado", value: aprobados, text: "text-emerald-400" },
        { label: "Completados", filterKey: "Realizado / Finalizado", value: completados, text: "text-cyan-400" }
      ];

      const html = items.map((item, idx) => {
        const isActive = activeStatusFilter === item.filterKey;
        const activeClass = isActive ? "active-kpi" : "";
        return `
          <div onclick="setStatusFilter('${item.filterKey}')"
            class="glass-card ${activeClass} p-3 rounded-2xl flex items-center gap-2.5 cursor-pointer select-none shrink-0 w-36 md:w-auto snap-start"
            title="Filtrar por: ${item.label}">
            <div class="min-w-0">
              <div class="text-lg font-extrabold ${item.text} tracking-tight leading-none">${item.value}</div>
              <div class="text-[10px] text-slate-400 font-medium truncate mt-1">${item.label}</div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('kpiContainer').innerHTML = html;
    }

    function populateDropdowns() {
      const filterComp = document.getElementById('filterCompany');
      filterComp.innerHTML = '<option value="">Todas las empresas</option>' + 
        config.companies.map(c => `<option value="${c}">${c}</option>`).join('');

      const filterPrio = document.getElementById('filterPriority');
      filterPrio.innerHTML = '<option value="">Todas las prioridades</option>' + 
        config.priorities.map(p => `<option value="${p.name}">${p.name}</option>`).join('');

      const taskComp = document.getElementById('taskCompany');
      taskComp.innerHTML = config.companies.map(c => `<option value="${c}">${c}</option>`).join('');

      const taskStat = document.getElementById('taskStatus');
      taskStat.innerHTML = config.statuses.map(s => `<option value="${s.name}">${s.name}</option>`).join('');

      const taskPrio = document.getElementById('taskPriority');
      taskPrio.innerHTML = config.priorities.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
    }

    // TABLA
    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const compFilter = document.getElementById('filterCompany').value;
      const prioFilter = document.getElementById('filterPriority').value;

      let filtered = tasks.filter(t => {
        const matchesSearch = t.company.toLowerCase().includes(search) || 
                              t.desc.toLowerCase().includes(search) || 
                              (t.details && t.details.toLowerCase().includes(search));
        const matchesComp = !compFilter || t.company === compFilter;
        const matchesPrio = !prioFilter || t.priority === prioFilter;
        let matchesStatus = !activeStatusFilter || (t.status === activeStatusFilter);
        return matchesSearch && matchesComp && matchesPrio && matchesStatus;
      });

      filtered.sort((a, b) => {
        const isDoneA = a.status.includes("Finalizado") || a.status.includes("Realizado");
        const isDoneB = b.status.includes("Finalizado") || b.status.includes("Realizado");
        if (isDoneA && !isDoneB) return 1;
        if (!isDoneA && isDoneB) return -1;
        const prioWeights = { "Máxima": 3, "Media": 2, "Mínima": 1 };
        return (prioWeights[b.priority] || 0) - (prioWeights[a.priority] || 0);
      });

      const tbody = document.getElementById('tasksTableBody');
      const empty = document.getElementById('emptyState');

      if (filtered.length === 0) {
        if (tbody) tbody.innerHTML = "";
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      tbody.innerHTML = filtered.map((task) => {
        let prioClass = "bg-slate-800/60 text-slate-300 border border-slate-700/40";
        if (task.priority === "Máxima") prioClass = "bg-rose-500/10 text-rose-400 border border-rose-500/30";
        else if (task.priority === "Media") prioClass = "bg-amber-500/10 text-amber-400 border border-amber-500/30";

        let statusBadgeClass = "bg-slate-800/60 text-slate-300 border border-slate-700/40";
        if (task.progress <= 0) statusBadgeClass = "bg-slate-500/10 text-slate-400 border border-slate-500/20";
        else if (task.progress <= 35) statusBadgeClass = "bg-yellow-500/10 text-yellow-400 border border-yellow-500/30";
        else if (task.progress <= 60) statusBadgeClass = "bg-lime-500/10 text-lime-400 border border-lime-500/30";
        else if (task.progress <= 85) statusBadgeClass = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
        else statusBadgeClass = "bg-cyan-500/10 text-cyan-400 border border-cyan-500/30";

        return `
          <tr onclick="onRowClick(event, '${task.id}')" class="table-row-card group" title="Click para editar">
            <td class="py-3 px-4 text-center">
              ${renderCircularProgress(task.progress !== undefined ? task.progress : 0)}
            </td>
            <td class="py-3 px-4 font-semibold text-white whitespace-nowrap">
              <span class="inline-block px-2.5 py-1 rounded-xl bg-white/[0.05] text-xs font-semibold text-slate-200 border border-white/[0.05]">
                ${task.company}
              </span>
            </td>
            <td class="py-3 px-4 font-medium text-slate-200 max-w-sm leading-snug">
              ${task.desc}
            </td>
            <td class="py-3 px-4 whitespace-nowrap">
              <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${statusBadgeClass}">
                ${task.status}
              </span>
            </td>
            <td class="py-3 px-4 whitespace-nowrap">
              <span class="inline-block px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider ${prioClass}">
                ${task.priority}
              </span>
            </td>
            <td class="py-3 px-4 text-xs text-slate-400 whitespace-nowrap">
              ${task.date ? task.date : '<span class="text-slate-600">-</span>'}
            </td>
            <td class="py-3 px-4 text-xs text-slate-400 max-w-xs truncate">
              ${task.details ? task.details : '<span class="text-slate-600">-</span>'}
            </td>
            <td class="py-3 px-4 text-center whitespace-nowrap" onclick="event.stopPropagation()">
              <div class="inline-flex items-center gap-1 opacity-80 group-hover:opacity-100">
                <button onclick="editTask('${task.id}')" title="Editar tarea" class="w-8 h-8 rounded-xl text-slate-400 hover:text-cyan-400 hover:bg-cyan-500/10 flex items-center justify-center">
                  <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button onclick="deleteTask('${task.id}')" title="Eliminar tarea" class="w-8 h-8 rounded-xl text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 flex items-center justify-center">
                  <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function onRowClick(e, id) {
      editTask(id);
    }

    function openTaskModal(task = null) {
      document.getElementById('taskForm').reset();
      if (task) {
        document.getElementById('modalTitleText').innerText = "Editar Tarea";
        document.getElementById('taskId').value = task.id;
        document.getElementById('taskCompany').value = task.company;
        document.getElementById('taskDesc').value = task.desc;
        document.getElementById('taskStatus').value = task.status;
        document.getElementById('taskPriority').value = task.priority;
        document.getElementById('taskDate').value = task.date;
        document.getElementById('taskDetails').value = task.details || "";
      } else {
        document.getElementById('modalTitleText').innerText = "Nueva Tarea";
        document.getElementById('taskId').value = "";
        // Fecha de hoy por defecto para nuevas tareas
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        document.getElementById('taskDate').value = `${yyyy}-${mm}-${dd}`;
      }
      document.getElementById('taskModal').classList.remove('hidden');
    }

    function closeTaskModal() {
      document.getElementById('taskModal').classList.add('hidden');
    }

    async function saveTask(e) {
      e.preventDefault();
      const id = document.getElementById('taskId').value || ("task-" + Date.now());
      const company = document.getElementById('taskCompany').value;
      const desc = document.getElementById('taskDesc').value;
      const status = document.getElementById('taskStatus').value;
      const priority = document.getElementById('taskPriority').value;
      const date = document.getElementById('taskDate').value;
      const details = document.getElementById('taskDetails').value;

      const statusMap = {
        "No realizado": 0,
        "En proceso": 25,
        "Chequeo / Entregado": 50,
        "Aprobado": 75,
        "Realizado / Finalizado": 100
      };
      const progress = statusMap[status] !== undefined ? statusMap[status] : 0;

      const taskObj = sanitizeTask({ id, company, desc, status, priority, date, progress, details });

      const index = tasks.findIndex(t => t.id === id);
      if (index !== -1) {
        tasks[index] = taskObj;
      } else {
        tasks.unshift(taskObj);
      }

      closeTaskModal();
      await saveToCloud();
    }

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) openTaskModal(task);
    }

    async function deleteTask(id) {
      if (confirm("¿Eliminar este trabajo?")) {
        tasks = tasks.filter(t => t.id !== id);
        await saveToCloud();
      }
    }

    function openVariantsModal() {
      renderVariantsUI();
      document.getElementById('variantsModal').classList.remove('hidden');
    }

    function closeVariantsModal() {
      document.getElementById('variantsModal').classList.add('hidden');
    }

    function renderVariantsUI() {
      const compList = document.getElementById('companiesList');
      compList.innerHTML = config.companies.map(c => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/[0.04] text-xs font-semibold text-slate-200 border border-white/[0.05]">
          ${c}
          <button onclick="removeCompany('${c}')" class="text-slate-500 hover:text-rose-400 font-bold ml-0.5">✕</button>
        </span>
      `).join('');
    }

    async function addCompany() {
      const nameInput = document.getElementById('newCompanyName');
      const name = nameInput.value.trim();
      if (name && !config.companies.includes(name)) {
        config.companies.push(name);
        nameInput.value = "";
        renderVariantsUI();
        populateDropdowns();
        await saveToCloud();
      }
    }

    async function removeCompany(name) {
      if (config.companies.length <= 1) {
        alert("Debe quedar al menos una empresa.");
        return;
      }
      config.companies = config.companies.filter(c => c !== name);
      renderVariantsUI();
      populateDropdowns();
      await saveToCloud();
    }

    function openBottomSheet() {
      document.getElementById('bottomSheetModal').classList.remove('hidden');
    }

    function closeBottomSheet() {
      document.getElementById('bottomSheetModal').classList.add('hidden');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ config, tasks }, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `trabajos_pendientes_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.tasks && Array.isArray(imported.tasks)) {
            tasks = imported.tasks.map(sanitizeTask);
            if (imported.config && Array.isArray(imported.config.companies)) {
              config.companies = imported.config.companies;
            }
            populateDropdowns();
            renderTable();
            renderKPIs();
            await saveToCloud();
            alert("¡Datos importados y guardados con éxito!");
          } else {
            alert("El archivo no tiene un formato válido.");
          }
        } catch (err) {
          alert("Error al leer el archivo JSON: " + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    // Arranque inicial
    populateDropdowns();
    renderKPIs();
    renderTable();
    loadFromCloud();

    // Auto-sincronizar al volver a enfocar la pestaña
    window.addEventListener('focus', () => loadFromCloud(true));
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadFromCloud(true);
    });
  </script>
</body>
</html>
